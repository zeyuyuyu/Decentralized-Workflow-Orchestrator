<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkFlow Hero 🏆</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body class="bg-gradient-to-br from-indigo-900 to-purple-800 min-h-screen text-white">
    <div class="container mx-auto px-4 py-8">
        <!-- Achievement Banner -->
        <div id="achievementBanner" class="hidden animate__animated animate__bounceIn fixed top-5 right-5 bg-yellow-400 text-black p-4 rounded-lg shadow-lg z-50">
            🎉 Achievement Unlocked!
        </div>

        <!-- Profile Section -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <img id="userAvatar" src="https://api.dicebear.com/6.x/avataaars/svg?seed=workflow" class="w-16 h-16 rounded-full border-4 border-yellow-400">
                    <span class="absolute -top-2 -right-2 bg-green-500 px-2 py-1 rounded-full text-sm font-bold">Lvl 5</span>
                </div>
                <div>
                    <h2 class="text-2xl font-bold">Workflow Master</h2>
                    <div class="flex items-center space-x-2">
                        <div class="bg-purple-700 rounded-full h-4 w-48">
                            <div id="xpBar" class="bg-yellow-400 rounded-full h-4" style="width: 75%"></div>
                        </div>
                        <span class="text-sm">750/1000 XP</span>
                    </div>
                </div>
            </div>
            <div class="text-right">
                <div class="text-yellow-400 text-2xl font-bold">🏆 1,234 points</div>
                <div class="text-sm">Rank #42 globally</div>
            </div>
        </div>

        <!-- Main Workflow Area with Gamification -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white bg-opacity-10 p-6 rounded-xl backdrop-blur-lg">
                <h3 class="text-xl font-bold mb-4">Active Workflows</h3>
                <div class="space-y-4">
                    <div class="workflow-card bg-purple-700 bg-opacity-50 p-4 rounded-lg cursor-pointer hover:bg-opacity-70 transition">
                        <div class="flex justify-between items-center">
                            <span class="font-bold">Data Processing Pipeline</span>
                            <span class="text-yellow-400">+50 XP</span>
                        </div>
                        <div class="mt-2 flex items-center space-x-2">
                            <div class="h-2 bg-green-500 rounded-full w-3/4"></div>
                            <span class="text-sm">75%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Social Proof & Leaderboard -->
            <div class="bg-white bg-opacity-10 p-6 rounded-xl backdrop-blur-lg">
                <h3 class="text-xl font-bold mb-4">🏆 Top Workflow Heroes</h3>
                <div class="space-y-4">
                    <div class="flex items-center justify-between p-2 bg-purple-700 bg-opacity-50 rounded-lg">
                        <div class="flex items-center space-x-3">
                            <span class="text-yellow-400 font-bold">1</span>
                            <img src="https://api.dicebear.com/6.x/avataaars/svg?seed=winner" class="w-8 h-8 rounded-full">
                            <span>WorkflowNinja</span>
                        </div>
                        <span>12,345 pts</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Achievement Showcase -->
        <div class="mt-8 bg-white bg-opacity-10 p-6 rounded-xl backdrop-blur-lg">
            <h3 class="text-xl font-bold mb-4">🌟 Recent Achievements</h3>
            <div class="flex space-x-4 overflow-x-auto pb-4">
                <div class="flex-shrink-0 w-24 text-center">
                    <div class="w-16 h-16 mx-auto bg-yellow-400 rounded-full flex items-center justify-center text-2xl">🚀</div>
                    <div class="mt-2 text-sm">First Deploy</div>
                </div>
                <div class="flex-shrink-0 w-24 text-center">
                    <div class="w-16 h-16 mx-auto bg-gray-400 rounded-full flex items-center justify-center text-2xl">⚡</div>
                    <div class="mt-2 text-sm">Speed Demon</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simulated achievement popup
        setTimeout(() => {
            document.getElementById('achievementBanner').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('achievementBanner').classList.add('animate__bounceOut');
            }, 3000);
        }, 2000);

        // XP animation
        setInterval(() => {
            const xpBar = document.getElementById('xpBar');
            const currentWidth = parseInt(xpBar.style.width) || 75;
            xpBar.style.width = `${(currentWidth + 1) % 100}%`;
        }, 1000);
    </script>
</body>
</html>
